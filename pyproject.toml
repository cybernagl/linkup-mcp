[project]
name = "linkup-mcp"
version = "0.1.1"
description = "MCP server for the whole Linkup web API: search, fetch, research, batch tasks, credits, extract and rewind, with the documentation built in"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Silbernagl" }]
keywords = ["mcp", "model-context-protocol", "linkup", "web-search", "research", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "mcp>=1.30,<2",
  "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://github.com/cybernagl/linkup-mcp"
Issues = "https://github.com/cybernagl/linkup-mcp/issues"
"Linkup docs" = "https://docs.linkup.so"

[project.scripts]
linkup-mcp = "linkup_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkup_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/linkup_mcp", "tests", "README.md", "LICENSE", "pyproject.toml"]
